name: plugin-admin-provider-operation
on:
  workflow_dispatch:
    inputs:
      operation: {required: true, type: choice, options: [plugin_install, app_full_access]}
      target: {required: true, type: string}
      request_id: {required: true, type: string}
concurrency:
  group: plugin-admin-provider-operation
  cancel-in-progress: false
permissions: {contents: read}
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'git+https://github.com/B4PT0R/codex-backend-sdk.git@d13ac98ec0dc2a7ccd316ac9e6c2d8a137a1282b'
      - run: python runner/plugin_admin_action.py
        env:
          PLUGIN_OPERATION: ${{ inputs.operation }}
          PLUGIN_TARGET: ${{ inputs.target }}
          PLUGIN_REQUEST_ID: ${{ inputs.request_id }}
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
          CHATGPT_COOKIE: ${{ secrets.CHATGPT_COOKIE }}
          CHATGPT_BROWSER_HEADERS: ${{ secrets.CHATGPT_BROWSER_HEADERS }}
          COGNILODE_GITHUB_TOKEN: ${{ secrets.COGNILODE_GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: plugin-operation-receipt, path: plugin-operation-receipt.json, if-no-files-found: warn, retention-days: 7}
