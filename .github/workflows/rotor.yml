name: cognilode-chatmode-rotor
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
concurrency:
  group: cognilode-chatmode-single-owner
  cancel-in-progress: false
permissions: {contents: read}
jobs:
  rotor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with:
          repository: evanbrown3000/cognilode-core-application
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: core
      - run: python -m pip install --disable-pip-version-check 'git+https://github.com/B4PT0R/codex-backend-sdk.git@d13ac98ec0dc2a7ccd316ac9e6c2d8a137a1282b'
      - run: python runner/rotor.py
        env:
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
          CHATGPT_COOKIE: ${{ secrets.CHATGPT_COOKIE }}
          CHATGPT_BROWSER_HEADERS: ${{ secrets.CHATGPT_BROWSER_HEADERS }}
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          NETWORK_INGEST_URL: https://cognilode-provider-http-evidence.evanbrown3000.workers.dev/ingest
          STATE_REPOSITORY: evanbrown3000/cognilode-agent-turns
          ROTOR_STATE_REPOSITORY: evanbrown3000/cognilode-agent-turns
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatmode-turn-receipt
          path: turn-receipt.json
          if-no-files-found: ignore
          retention-days: 7
