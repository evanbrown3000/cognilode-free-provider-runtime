name: prompt-four-chatmode-employees
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chatmode:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        assignment: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check curl_cffi
      - run: python runner/run_recovered.py
        env:
          ASSIGNMENT_INDEX: ${{ matrix.assignment }}
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
          CHATGPT_COOKIE: ${{ secrets.CHATGPT_COOKIE }}
          CHATGPT_BROWSER_HEADERS: ${{ secrets.CHATGPT_BROWSER_HEADERS }}
          COGNILODE_SENTINEL_VM: ${{ github.workspace }}/runner/chatgpt_sentinel_vm.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatmode-turn-${{ matrix.assignment }}
          path: |
            result.json
            conversation-events.jsonl
          if-no-files-found: warn
          retention-days: 30
