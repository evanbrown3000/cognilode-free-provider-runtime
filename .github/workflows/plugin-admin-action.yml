name: cognilode-plugin-admin-action
on:
  workflow_dispatch:
    inputs:
      request_id: {required: true, type: string}
      operation: {required: true, type: string}
      arguments: {required: true, type: string}
concurrency:
  group: cognilode-chatgpt-single-provider-owner
  cancel-in-progress: false
permissions: {contents: read}
jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests
      - run: python runner/plugin_admin_action.py
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          OPERATION: ${{ inputs.operation }}
          ARGUMENTS: ${{ inputs.arguments }}
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
          CHATGPT_COOKIE: ${{ secrets.CHATGPT_COOKIE }}
          CHATGPT_BROWSER_HEADERS: ${{ secrets.CHATGPT_BROWSER_HEADERS }}
          COGNILODE_GITHUB_TOKEN: ${{ secrets.COGNILODE_GITHUB_TOKEN }}
          STATE_REPOSITORY: evanbrown3000/cognilode-agent-turns
