name: cognilode-browser-chatmode-turns
on:
  workflow_dispatch:
concurrency:
  group: cognilode-browser-chatmode-owner
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  chatmode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright
      - run: xvfb-run -a python runner/browser_turns.py
        env:
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_COOKIES }}
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-turns-receipt
          path: browser-turns-receipt.json
          if-no-files-found: error
          retention-days: 30
