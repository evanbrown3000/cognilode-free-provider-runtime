name: collect-accepted-chatmode-turns
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check codex-backend-sdk==0.5.9
      - run: python runner/collect.py
        env:
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
          CHATGPT_COOKIE: ${{ secrets.CHATGPT_COOKIE }}
          CHATGPT_BROWSER_HEADERS: ${{ secrets.CHATGPT_BROWSER_HEADERS }}
          GITHUB_OWNER_TOKEN: ${{ secrets.GITHUB_OWNER_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-chatmode-conversations
          path: matched-conversations.json
          if-no-files-found: warn
          retention-days: 30
