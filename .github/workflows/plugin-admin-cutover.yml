name: plugin-admin-free-cutover
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: evanbrown3000/plugin-admin
          token: ${{ secrets.CORE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Project the native account grant
        env:
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
        run: |
          umask 077
          python3 - <<'PY'
          import json, os
          with open('/tmp/plugin-admin-auth.json','w') as f:
              json.dump({'tokens': {'access_token': os.environ['CHATGPT_ACCESS_TOKEN'], 'account_id': os.environ['CHATGPT_ACCOUNT_ID']}}, f)
          PY
      - name: Require Allow all actions readback
        run: |
          printf '%s' '{"app_id":"asdk_app_6ae24a6b9adc819194f05ea2c91c14cc"}' >/tmp/app.json
          node scripts/admin.mjs app_full_access --auth-file /tmp/plugin-admin-auth.json --arguments-file /tmp/app.json >app-full-access.json
          python3 - <<'PY'
          import json
          v=json.load(open('app-full-access.json'))
          assert v.get('ok') is True, v
          r=v.get('result') or {}
          assert r.get('apps_privacy_control') == 'full_access', v
          assert r.get('app_id') == 'asdk_app_6ae24a6b9adc819194f05ea2c91c14cc', v
          print(json.dumps({'ok':True,'app_id':r['app_id'],'link_id':r.get('link_id'),'apps_privacy_control':r['apps_privacy_control'],'changed':r.get('changed')}))
          PY
      - name: Require installed and enabled plugin readback
        run: |
          printf '%s' '{"plugin_id":"plugin_asdk_app_6ae24a6b9adc819194f05ea2c91c14cc"}' >/tmp/plugin.json
          node scripts/admin.mjs plugin_install --auth-file /tmp/plugin-admin-auth.json --arguments-file /tmp/plugin.json >plugin-install.json
          python3 - <<'PY'
          import json
          v=json.load(open('plugin-install.json'))
          assert v.get('ok') is True, v
          r=v.get('result') or {}
          assert r.get('plugin_id') == 'plugin_asdk_app_6ae24a6b9adc819194f05ea2c91c14cc', v
          exact=[p for p in r.get('readback',[]) if p.get('id') == r.get('plugin_id')]
          assert r.get('installed') is True and len(exact) == 1 and exact[0].get('enabled') is True, v
          print(json.dumps({'ok':True,'plugin_id':r['plugin_id'],'installed':True,'enabled':True,'changed':r.get('changed')}))
          PY
      - name: Mirror provider HTTP evidence into Operator Network
        if: always()
        env:
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, uuid
          for name in ('app-full-access.json','plugin-install.json'):
              try: value=json.load(open(name))
              except FileNotFoundError: continue
              for source in value.get('provider_requests',[]):
                  event={
                    'event_id': source.get('event_id') or str(uuid.uuid4()),
                    'observed_at': time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
                    'provider':'chatgpt.com','producer':'plugin-admin-free-native',
                    'operation':'plugin_admin','phase':'provider_http_response',
                    'method':source.get('method'),'url':'https://chatgpt.com/backend-api'+source.get('path',''),
                    'response_status':source.get('status'),'elapsed_ms':source.get('duration_ms'),
                    'network_route':'github-actions-free-native','environment_id':os.environ.get('GITHUB_RUN_ID'),
                    'credential_ref':'chatgpt.codex-auth','response_headers':{}
                  }
                  request=urllib.request.Request('https://cognilode-provider-http-evidence.evanbrown3000.workers.dev/ingest',data=json.dumps(event).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['OPERATOR_TOKEN'],'Content-Type':'application/json'})
                  try: urllib.request.urlopen(request,timeout=20).read()
                  except Exception: pass
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-admin-provider-readback
          path: |
            app-full-access.json
            plugin-install.json
          if-no-files-found: warn
          retention-days: 7
