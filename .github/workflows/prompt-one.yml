name: qualify-prepared-chatmode-turn
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chatmode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check codex-backend-sdk==0.5.9
      - run: python runner/prompt.py
        env:
          ASSIGNMENT_INDEX: '0'
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
          CHATGPT_COOKIE: ${{ secrets.CHATGPT_COOKIE }}
          CHATGPT_BROWSER_HEADERS: ${{ secrets.CHATGPT_BROWSER_HEADERS }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-chatmode-turn
          path: |
            result.json
            conversation.jsonl
          if-no-files-found: warn
          retention-days: 30
