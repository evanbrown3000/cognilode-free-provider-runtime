name: plugin-admin-native-request
on:
  workflow_dispatch:
    inputs:
      issue_number: {required: true, type: string}
permissions:
  contents: write
  issues: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: evanbrown3000/plugin-admin
          token: ${{ secrets.CORE_REPO_TOKEN }}
      - name: Execute one encrypted fixed-path native request
        env:
          GH_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
          REQUEST_KEY: ${{ secrets.PLUGIN_ADMIN_REQUEST_KEY }}
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          CHATGPT_ACCOUNT_ID: ${{ secrets.CHATGPT_ACCOUNT_ID }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          STATE_REPO: evanbrown3000/cognilode-agent-turns
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['STATE_REPO']}/issues/{os.environ['ISSUE_NUMBER']}",headers=headers)
          with urllib.request.urlopen(req,timeout=30) as f: issue=json.load(f)
          envelope=json.loads(issue['body'])
          key=base64.b64decode(os.environ['REQUEST_KEY']); iv=base64.b64decode(envelope['iv']); cipher=base64.b64decode(envelope['ciphertext'])
          value=json.loads(AESGCM(key).decrypt(iv,cipher,b'cognilode.plugin-admin.request.v1'))
          request={'method':value['method'],'path':value['path'],'body':value.get('body'),'oauth':{'access_token':os.environ['CHATGPT_ACCESS_TOKEN'],'account_id':os.environ['CHATGPT_ACCOUNT_ID']}}
          process=subprocess.run(['python3','src/native_transport.py'],input=json.dumps(request),text=True,capture_output=True,timeout=40)
          result={'ok':True,'result':{'exit_code':process.returncode,'stdout':process.stdout,'stdout_truncated':False}}
          encoded=base64.b64encode((json.dumps(result,separators=(',',':'))+'\n').encode()).decode()
          path=f"plugin-admin-results/{value['request_id']}.json"
          target=f"https://api.github.com/repos/{os.environ['STATE_REPO']}/contents/{path}"
          payload=json.dumps({'message':'Complete Plugin Admin native request '+value['request_id'],'content':encoded}).encode()
          out=urllib.request.Request(target,data=payload,method='PUT',headers=headers)
          with urllib.request.urlopen(out,timeout=30) as f: json.load(f)
          PY
