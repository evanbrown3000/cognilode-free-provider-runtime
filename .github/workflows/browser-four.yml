name: four-chatmode-browser-turns
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: read
concurrency:
  group: cognilode-chatmode-browser-rotor
  cancel-in-progress: false
jobs:
  chatmode:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [provider, corpus, plugins, organization]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python runner/browser_turn.py
        env:
          LANE: ${{ matrix.lane }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_COOKIES }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-turn-${{ matrix.lane }}
          path: turn-receipt.json
          if-no-files-found: warn
          retention-days: 7
